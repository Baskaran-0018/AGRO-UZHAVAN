<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Left Green Leaf Motif -->
  <path d="M140 180 C80 230 60 320 110 390 C160 450 250 440 230 380 C210 320 180 340 160 330 C120 310 110 260 140 180 Z" fill="url(#leafGrad)"/>
  <path d="M140 180 C110 240 120 320 190 350" stroke="#bbf7d0" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M145 250 C160 270 175 285 190 290" stroke="#bbf7d0" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Center 'A' Rising Trend Arrow Motif -->
  <path d="M190 400 L240 280 L290 350 L360 210" stroke="url(#tealGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Arrowhead -->
  <polygon points="360,180 390,240 330,235" fill="#06b6d4"/>

  <!-- Right 'A' Leg -->
  <path d="M260 230 L350 410" stroke="#16a34a" stroke-width="26" stroke-linecap="round" opacity="0.9"/>
  <!-- Crossbar of A -->
  <path d="M215 340 L315 340" stroke="url(#tealGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Top Tech Bar Chart & Circuit Nodes -->
  <rect x="290" y="150" width="18" height="60" rx="9" fill="#14b8a6"/>
  <rect x="320" y="120" width="18" height="90" rx="9" fill="#06b6d4"/>
  <rect x="350" y="90" width="18" height="120" rx="9" fill="#38bdf8"/>

  <!-- Tech Nodes -->
  <circle cx="230" cy="180" r="14" fill="#0284c7"/>
  <circle cx="270" cy="140" r="14" fill="#0d9488"/>
  <circle cx="390" cy="170" r="12" fill="#14b8a6"/>
  <line x1="230" y1="180" x2="270" y2="140" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
  <line x1="360" y1="210" x2="390" y2="170" stroke="#14b8a6" stroke-width="6" stroke-linecap="round"/>
</svg>